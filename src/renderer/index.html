<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc-heads.net; script-src 'self';" />
  <title>Marsana Client</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div id="boot-splash" class="boot-splash" aria-live="polite" aria-busy="true">
    <div class="boot-splash-inner">
      <img class="boot-splash-logo" src="assets/logo.png" width="72" height="72" alt="" />
      <h1 class="boot-splash-title">Marsana Launcher</h1>
      <div class="boot-splash-spinner" aria-hidden="true"></div>
      <p class="boot-splash-status" id="boot-splash-status">Yükleniyor…</p>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <img class="logo" src="assets/logo.png" width="44" height="44" alt="Marsana Launcher" />
        <span class="brand-name">Marsana Client <small class="app-version">v1.0.32</small></span>
      </div>
      <button type="button" class="btn ghost" id="how-to-play-trigger" data-i18n="header.howToPlay" data-i18n-attr="title:header.howToPlayTitle">
        Nasıl oynanır?
      </button>
      <button type="button" class="btn ghost" id="update-trigger" data-i18n="header.restart" data-i18n-attr="title:header.restartTitle">
        Yeniden başlat
      </button>
      <button type="button" class="btn ghost" id="settings-trigger" data-i18n="header.settings" data-i18n-attr="title:header.settingsTitle">
        Ayarlar
      </button>
    </div>
    <div id="account-slot" class="account"></div>
  </header>

  <main class="main">
    <div class="dashboard-grid">
      <section class="card launch-card">
      <h2 data-i18n="launch.title">Oyunu Başlat</h2>
      <div id="version-slot"></div>
      <div id="memory-slot"></div>
      <div id="play-slot" class="launch-play-wrap"></div>
    </section>

      <section class="card log">
        <h3 data-i18n="launch.status">Durum</h3>
        <div id="status-slot"></div>
      </section>

      <section class="card website-links-card">
        <div id="platforms-slot"></div>
        <div id="website-links-slot"></div>
      </section>

      <section class="card profile-card">
        <div id="profile-slot"></div>
        <div id="cosmetics-slot"></div>
      </section>
    </div>

    <section class="card mods-card full-width">
      <div id="mode-switcher-slot"></div>
      <div id="mods-slot"></div>
      <div class="mods-card-actions">
        <div id="launch-options-slot"></div>
      </div>
    </section>

    <section class="card servers-card full-width">
      <div id="servers-slot"></div>
    </section>
  </main>

  <footer class="bottom-bar" id="bottom-links-slot"></footer>

  <div id="modal-slot"></div>
  <div id="how-to-play-slot" aria-hidden="true"></div>
  <div id="settings-modal-slot" aria-hidden="true"></div>

  <div id="update-overlay" class="update-overlay hidden" aria-hidden="true">
    <div class="update-overlay-card">
      <div class="update-spinner" aria-hidden="true"></div>
      <h2 class="update-overlay-title" data-role="title">Güncelleme</h2>
      <p class="update-overlay-message" data-role="message"></p>
      <div class="progress-wrap update-overlay-progress" data-role="progress-wrap" style="display: none">
        <div class="progress-bar" data-role="bar"></div>
      </div>
      <button type="button" class="btn primary update-overlay-dismiss hidden" data-role="dismiss">Tamam</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
