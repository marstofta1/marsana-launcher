name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - 'docs/mobile/**'
      - 'scripts/sync-mobile-www.js'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Sync web assets and build release APK
        working-directory: mobile-app
        run: |
          npm run sync:www
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK artifact
        run: |
          APK=$(find mobile-app/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          mkdir -p artifacts/android
          cp "$APK" "artifacts/android/Marsana.Launcher-$(node -p "require('./mobile-app/package.json').version")-android.apk"

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./mobile-app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          files: artifacts/android/*.apk
          make_latest: true
