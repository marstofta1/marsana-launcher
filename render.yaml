services:
  - type: web
    name: marsana-analytics
    runtime: node
    rootDir: analytics-server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      # Gizli degerler repoya yazilmaz. Render panelinden (Environment sekmesi) girilir.
      # sync: false => Render bu degeri blueprint'ten okumaz, dashboard'da tanimli olani kullanir.
      - key: MARSANALIZ_GATE_PASSWORD
        sync: false
      - key: MARSANA_ANALYTICS_ADMIN_TOKEN
        sync: false
